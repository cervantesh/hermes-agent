name: Update command decomposition Windows focused CI

on:
  push:
    branches:
      - ci/update-cmd-decomposition-windows-focused
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-focused:
    name: exact candidate Windows guards
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate plus CI harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project and test dependencies
        run: uv sync --locked --python 3.11 --extra dev

      - name: Run decomposition and Windows updater guards
        shell: bash
        run: |
          uv run python -m pytest -q --tb=short \
            tests/hermes_cli/test_backup.py::TestRunPreUpdateBackup \
            tests/hermes_cli/test_lazy_command_exports.py \
            tests/hermes_cli/test_update_modified_notice.py \
            tests/hermes_cli/test_update_stale_module_purge.py \
            tests/hermes_cli/test_windows_update_restart_reconciliation.py
