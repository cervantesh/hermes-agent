name: External application boundary fork CI

on:
  push:
    branches:
      - cervantesh/external-application-boundary-ci

permissions:
  contents: read

concurrency:
  group: external-application-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focal-tests:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install focal test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Run boundary and configuration tests
        run: >-
          uv run --no-sync python -m pytest
          tests/test_external_application_boundary.py
          tests/test_external_application_boundary_launchers.py
          tests/hermes_cli/test_config_validation.py
          -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Check focused Python files
        if: runner.os == 'Linux'
        run: >-
          uv run --no-sync ruff check
          hermes_application_boundary.py
          hermes_bootstrap.py
          tests/test_external_application_boundary.py
          tests/test_external_application_boundary_launchers.py
          tests/hermes_cli/test_config_validation.py

      - name: Check patch whitespace
        if: runner.os == 'Linux'
        run: git diff --check HEAD^
